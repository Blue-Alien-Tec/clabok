name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the binary (no leading v)
        required: false
        default: dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p dist stage
          if [ "$GOOS" = windows ]; then EXE=.exe; else EXE=; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/Blue-Alien-Tec/clabok/internal/buildinfo.Version=${VERSION}" \
            -o "dist/pecia${EXE}" ./cmd/pecia
          cp README.md LICENSE stage/
          if [ "$GOOS" = windows ]; then
            cp "dist/pecia.exe" stage/
            (cd stage && zip "../dist/pecia_${VERSION}_${GOOS}_${GOARCH}.zip" pecia.exe README.md LICENSE)
          else
            cp dist/pecia stage/
            tar -czf "dist/pecia_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C stage pecia README.md LICENSE
          fi
          rm -f "dist/pecia${EXE}"
      - uses: actions/upload-artifact@v7
        with:
          name: pecia-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
